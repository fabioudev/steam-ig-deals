<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="title desc">
  <title id="title">Wishlist badge mockup</title>
  <desc id="desc">Two Steam wishlist cards; the first shows an Instant Gaming price badge with 23 percent savings.</desc>
  <rect width="880" height="420" fill="#1b2838"/>
  <text x="40" y="52" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Wunschliste</text>

  <!-- Card 1 -->
  <rect x="40" y="80" width="380" height="300" rx="8" fill="#16202d"/>
  <rect x="40" y="80" width="380" height="150" rx="8" fill="#2a475e"/>
  <text x="60" y="165" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="15">ELDEN RING</text>
  <text x="60" y="272" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Elden Ring</text>
  <text x="60" y="300" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="15">59,99 €</text>

  <rect x="250" y="252" width="150" height="62" rx="6" fill="#1f3d2b" stroke="#4c9a5e" stroke-width="1.5"/>
  <text x="266" y="278" fill="#a4d4ae" font-family="system-ui, sans-serif" font-size="13" font-weight="600">INSTANT GAMING</text>
  <text x="266" y="300" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">45,99 €  −23 %</text>

  <!-- Card 2 -->
  <rect x="460" y="80" width="380" height="300" rx="8" fill="#16202d"/>
  <rect x="460" y="80" width="380" height="150" rx="8" fill="#2a475e"/>
  <text x="480" y="165" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="15">HADES II</text>
  <text x="480" y="272" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="19" font-weight="600">Hades II</text>
  <text x="480" y="300" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="15">29,99 €</text>

  <text x="40" y="405" fill="#5c6a75" font-family="system-ui, sans-serif" font-size="12">Mockup — actual styling follows Steam's theme.</text>
</svg>
