<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="title desc">
  <title id="title">Wishlist badge mockup</title>
  <desc id="desc">Two Steam wishlist cards; each shows a compact orange Instant Gaming badge with logo, gross price and discount above the Steam price.</desc>
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a15"/>
      <stop offset="1" stop-color="#ff3131"/>
    </linearGradient>
  </defs>
  <rect width="880" height="430" fill="#1b2838"/>
  <text x="40" y="52" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Wunschliste</text>

  <!-- Card 1 -->
  <rect x="40" y="80" width="800" height="140" rx="8" fill="#16202d"/>
  <rect x="56" y="96" width="150" height="108" rx="4" fill="#2a475e"/>
  <text x="70" y="152" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="12">GREEN HELL</text>
  <text x="224" y="128" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Green Hell</text>
  <text x="224" y="152" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="13">5. Sept. 2019 · Survival, Open World</text>

  <!-- IG badge above the price: logo + gross price + discount -->
  <rect x="600" y="94" width="220" height="30" rx="4" fill="url(#ig)"/>
  <rect x="600" y="94" width="3" height="30" fill="#6cc644"/>
  <text x="612" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" font-style="italic">instant gaming</text>
  <text x="722" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2,37 €</text>
  <rect x="770" y="101" width="40" height="16" rx="2" fill="#000000" opacity="0.2"/>
  <text x="775" y="113" fill="#ffe1c4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">−91 %</text>

  <!-- Steam price -->
  <rect x="620" y="158" width="200" height="46" rx="4" fill="#2a475e"/>
  <text x="632" y="177" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="11">Steam</text>
  <text x="632" y="196" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">2,39 €</text>

  <!-- Card 2 -->
  <rect x="40" y="240" width="800" height="140" rx="8" fill="#16202d"/>
  <rect x="56" y="256" width="150" height="108" rx="4" fill="#2a475e"/>
  <text x="70" y="312" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="12">ORI AND THE BLIND FOREST</text>
  <text x="224" y="288" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Ori and the Blind Forest</text>
  <text x="224" y="312" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="13">27. Apr. 2016 · Plattformer</text>

  <rect x="600" y="254" width="220" height="30" rx="4" fill="url(#ig)"/>
  <rect x="600" y="254" width="3" height="30" fill="#6cc644"/>
  <text x="612" y="273" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" font-style="italic">instant gaming</text>
  <text x="722" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4,87 €</text>
  <rect x="770" y="261" width="40" height="16" rx="2" fill="#000000" opacity="0.2"/>
  <text x="775" y="273" fill="#ffe1c4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">−80 %</text>

  <rect x="620" y="318" width="200" height="46" rx="4" fill="#2a475e"/>
  <text x="632" y="337" fill="#8f98a0" font-family="system-ui, sans-serif" font-size="11">Steam</text>
  <text x="632" y="356" fill="#c7d5e0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">4,99 €</text>

  <text x="40" y="415" fill="#5c6a75" font-family="system-ui, sans-serif" font-size="12">Mockup — Bruttopreise inkl. MwSt.; das Original-Logo wird zur Laufzeit von instant-gaming.com geladen.</text>
</svg>
